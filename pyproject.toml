[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytet"
version = "0.1.1"
description = "Local Windows GUI and CLI for extracting authorized YouTube audio and video from a URL."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "imageio-ffmpeg>=0.5.1",
  "mutagen>=1.47.0",
  "yt-dlp[default]>=2026.3.17",
]

[project.scripts]
ytet = "youtube_audio_extractor.cli:main"
ytet-gui = "youtube_audio_extractor.desktop_app:main"

[tool.setuptools.packages.find]
where = ["src"]
